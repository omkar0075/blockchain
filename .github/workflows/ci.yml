name: MEDway CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  contracts:
    name: Smart Contracts Suite (Hardhat & Foundry)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: contracts/package-lock.json

      - name: Install Contract Dependencies
        working-directory: contracts
        run: npm ci

      - name: Compile Solidity Contracts
        working-directory: contracts
        run: npx hardhat compile

      - name: Run Contract Tests
        working-directory: contracts
        run: npx hardhat test

  backend:
    name: Backend Test Suite (FastAPI, 9 Agents & LLM Layer)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup Node.js 20.x for Viem Bridge
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Node Dependencies
        working-directory: backend
        run: npm install

      - name: Install Python Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio anyio httpx

      - name: Run Backend Pytest Suite (293 Tests)
        working-directory: backend
        env:
          CORAL_RPC_URL: https://coralrpc.mstblockchain.com
          CHAIN_ID: "54635"
          CONTRACT_ADDRESS: "0xcd630b8e555e0751afbb9ae511869110d361bb83"
        run: pytest -v -k "not test_api"

      - name: Run System Verification Suite
        working-directory: backend
        env:
          CORAL_RPC_URL: https://coralrpc.mstblockchain.com
          CHAIN_ID: "54635"
          CONTRACT_ADDRESS: "0xcd630b8e555e0751afbb9ae511869110d361bb83"
        run: python test-system-verification.py

  frontend:
    name: Frontend Build & Typecheck (React 18 & Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck and Build
        working-directory: frontend
        run: npm run build
